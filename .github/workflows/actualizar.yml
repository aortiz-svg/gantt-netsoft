name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, re, json
          from datetime import datetime

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          print("Consultando Wrike...")

          # PASO 1 — Contactos @netsoft.com
          r = requests.get("https://www.wrike.com/api/v4/contacts", headers=headers)
          all_contacts = r.json().get("data", [])
          contacts = [c for c in all_contacts
                      if not c.get("deleted")
                      and c.get("type") == "Person"
                      and "@netsoft.com" in c.get("primaryEmail","")]
          cid_to_contact = {c["id"]: c for c in contacts}
          print("Contactos netsoft:", len(contacts))

          # PASO 2 — Todos los proyectos dentro de PROYECTOS ACTIVOS usando paginacion
          FOLDER_ID = "IEAEOUQVI5S3CPQR"
          all_projects = []
          next_token = None

          while True:
              params = {"pageSize": 200, "project": "true", "fields": '["project","members","customFields"]'}
              url = "https://www.wrike.com/api/v4/folders/" + FOLDER_ID + "/folders"
              if next_token:
                  params["nextPageToken"] = next_token
              r2 = requests.get(url, headers=headers, params=params)
              body = r2.json()
              all_projects.extend(body.get("data", []))
              next_token = body.get("nextPageToken")
              if not next_token:
                  break

          print("Total folders en PROYECTOS ACTIVOS:", len(all_projects))

          # Filtrar solo los proyectos principales (titulo empieza con IMPLEMENTACI)
          main_projects = [p for p in all_projects
                           if p.get("title","").upper().startswith("IMPLEMENTACI")
                           and p.get("project")
                           and p["project"].get("startDate")
                           and p["project"].get("endDate")]

          # Si no hay nada con ese filtro, tomar todos con fechas
          if not main_projects:
              main_projects = [p for p in all_projects
                               if p.get("project")
                               and p["project"].get("startDate")
                               and p["project"].get("endDate")]

          STATUS_SKIP = ["completed", "cancelled", "onhold"]
          active = [p for p in main_projects
                    if p["project"].get("status","").lower() not in STATUS_SKIP]

          print("Proyectos activos con fechas:", len(active))

          # PASO 3 — Recursos
          owner_ids = set()
          resource_ids = set()
          for p in active:
              proj = p.get("project", {})
              for oid in proj.get("ownerIds", []):
                  owner_ids.add(oid)
                  resource_ids.add(oid)
              for m in p.get("members", []):
                  mid = m if isinstance(m, str) else m.get("id", "")
                  if mid:
                      resource_ids.add(mid)

          netsoft_resources = [cid_to_contact[rid] for rid in resource_ids if rid in cid_to_contact]

          def is_mexico(c):
              tz = c.get("timezone", "")
              return "Mexico" in tz or "America/Mexico" in tz

          mx = [c for c in netsoft_resources if is_mexico(c)]
          final_resource_list = mx if len(mx) >= 5 else netsoft_resources

          final_contacts = []
          for c in final_resource_list:
              name = (c.get("firstName","") + " " + c.get("lastName","")).upper().strip()
              if name:
                  final_contacts.append({
                      "id": c["id"],
                      "name": name,
                      "role": "GERENTE" if c["id"] in owner_ids else "CONSULTOR"
                  })
          final_contacts.sort(key=lambda x: x["name"])
          print("Recursos finales:", len(final_contacts))

          # PASO 4 — Armar datos Gantt
          COLORS = ['#1d4ed8','#0e7490','#0f766e','#1e6b55','#4338ca','#6d28d9','#7c3aed',
                    '#2563eb','#0284c7','#0369a1','#1a6b8a','#164e63','#065f46','#0d5c6e',
                    '#1e40af','#3b5998','#5a2d82','#6b21a8','#374151']

          final_projects = []
          for i, p in enumerate(active[:25]):
              proj = p.get("project", {})
              name = p["title"].replace("IMPLEMENTACIÓN ","").replace("Implementación ","")
              final_projects.append({
                  "name": name,
                  "start": proj.get("startDate","2025-01-01"),
                  "end": proj.get("endDate","2026-12-31"),
                  "color": COLORS[i % len(COLORS)],
                  "owner_ids": proj.get("ownerIds",[]),
                  "member_ids": [m if isinstance(m,str) else m.get("id","") for m in p.get("members",[])]
              })

          cid_to_idx = {c["id"]: i for i, c in enumerate(final_contacts)}

          res_lines = []
          for c in final_contacts:
              color = "#1a3354" if c["role"] == "GERENTE" else "#2563eb"
              name = c["name"].replace("'", "\\'")
              res_lines.append("    ['" + name + "','" + c["role"] + "','" + color + "']")

          proj_lines = []
          for p in final_projects:
              name = p["name"].replace("'", "\\'")
              proj_lines.append("    ['" + name + "','" + p["start"] + "','" + p["end"] + "','" + p["color"] + "']")

          assign_lines = []
          for pi, p in enumerate(final_projects):
              added = set()
              for oid in p["owner_ids"]:
                  if oid in cid_to_idx and oid not in added:
                      assign_lines.append("    [" + str(cid_to_idx[oid]) + "," + str(pi) + ",'" + p["start"] + "','" + p["end"] + "',50]")
                      added.add(oid)
              for mid in p["member_ids"]:
                  if mid in cid_to_idx and mid not in added:
                      assign_lines.append("    [" + str(cid_to_idx[mid]) + "," + str(pi) + ",'" + p["start"] + "','" + p["end"] + "',50]")
                      added.add(mid)

          today = datetime.now().strftime("%B %Y")

          new_init  = "// GANTT_DATA_START\n"
          new_init += "function init(){\n"
          new_init += "  const RES=[\n" + ",\n".join(res_lines) + "\n  ];\n"
          new_init += "  RES.forEach(([n,role,color])=>addRes(n,role,color));\n"
          new_init += "  const PC=PROJ_COLORS;\n"
          new_init += "  const PROJ=[\n" + ",\n".join(proj_lines) + "\n  ];\n"
          new_init += "  PROJ.forEach(([n,s,e,color])=>addProj(n,s,e,color));\n"
          new_init += "  const A=[\n" + ",\n".join(assign_lines) + "\n  ];\n"
          new_init += "  A.forEach(([ri,pi,s,e,pct])=>addAssign(resources[ri].id,projects[pi].id,s,e,pct));\n"
          new_init += "  render();\n"
          new_init += "}\n"
          new_init += "init();\n"
          new_init += "// GANTT_DATA_END"

          with open("index.html","r",encoding="utf-8") as f:
              html = f.read()

          MARKER_START = "// GANTT_DATA_START"
          MARKER_END   = "// GANTT_DATA_END"
          start = html.find(MARKER_START)
          end   = html.find(MARKER_END)

          if start == -1 or end == -1:
              print("ERROR: No se encontraron los marcadores en el HTML")
              exit(1)

          new_html = html[:start] + new_init + html[end + len(MARKER_END):]
          new_html = re.sub(r'Datos Wrike · [^<"]+', 'Datos Wrike · ' + today, new_html)

          with open("index.html","w",encoding="utf-8") as f:
              f.write(new_html)

          print("OK: " + str(len(final_contacts)) + " recursos, " + str(len(final_projects)) + " proyectos escritos en index.html")
          PYEOF

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Gantt actualizado $(date '+%Y-%m-%d')"
          git push
