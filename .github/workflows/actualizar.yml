name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, json

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          # Ver spaces disponibles
          r = requests.get("https://www.wrike.com/api/v4/spaces", headers=headers)
          print("HTTP spaces:", r.status_code)
          spaces = r.json().get("data", [])
          print("Spaces encontrados:", len(spaces))
          for s in spaces:
              print("  Space:", s.get("title"), "| ID:", s.get("id"))

          # Por cada space, ver sus folders raíz
          for s in spaces[:3]:
              sid = s.get("id")
              rf = requests.get(
                  "https://www.wrike.com/api/v4/spaces/" + sid + "/folders",
                  headers=headers
              )
              print("\nFolders en space '" + s.get("title","") + "' (HTTP " + str(rf.status_code) + "):")
              folders = rf.json().get("data", [])
              for f in folders[:10]:
                  print("  ", f.get("title"), "| ID:", f.get("id"), "| childIds:", len(f.get("childIds",[])))

          PYEOF

      - name: Publicar cambios
        run: |
          echo "Solo debug"
