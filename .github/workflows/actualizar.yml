name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, json

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          SPACE_ID = "IEAEOUQVI5RISQI5"

          r = requests.get(
              "https://www.wrike.com/api/v4/spaces/" + SPACE_ID + "/folders",
              headers=headers
          )
          folders = r.json().get("data", [])

          # Buscar PROYECTOS ACTIVOS y folders con muchos hijos
          print("=== Folders con childIds > 5 ===")
          for f in folders:
              n_children = len(f.get("childIds",[]))
              if n_children > 5 or "ACTIVO" in f.get("title","").upper() or "PROYECTO" in f.get("title","").upper():
                  print("  ", f.get("title"), "| ID:", f.get("id"), "| childIds:", n_children)

          PYEOF

      - name: Publicar cambios
        run: |
          echo "Solo debug"
