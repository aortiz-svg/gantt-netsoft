name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, re
          from datetime import datetime

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          print("Consultando contactos Wrike...")
          r = requests.get("https://www.wrike.com/api/v4/contacts", headers=headers)
          all_contacts = r.json().get("data", [])
          cid_to_contact = {}
          for c in all_contacts:
              if not c.get("deleted") and c.get("type") == "Person" and "@netsoft.com" in c.get("primaryEmail",""):
                  cid_to_contact[c["id"]] = c
          print("Contactos netsoft:", len(cid_to_contact))

          # Consulting Managers por proyecto (columna CM de Wrike, actualizado 2026-05-21)
          # KUAVLK4B  = Carlos Alberto Yañez
          # KUAU4XSM  = Marco Antonio Guerrero
          # KUAVLK42  = Miguel Perez Galdino
          # KUAVKGOD  = Miryam Zoraya Vazquez
          # KUAUN2EM  = Gustavo Enrique Albornoz
          # KUAVLSHS  = Carlos Torreblanca
          # KUAPWMR5  = Ana Laura Sanchez
          # KUAU4XSD  = César Flores Alvarez
          # KUAVF4AX  = Miguel Borgo
          PROJECTS = [
              ("CONSULTIMER",             "2026-05-20","2026-09-10", []),
              ("DOT LIB",                 "2026-05-20","2026-09-10", []),
              ("SOPORTE PINOS",           "2026-05-20","2026-09-10", ["KUAU4XSD"]),
              ("ARTIMEDICA",              "2025-08-11","2026-06-04", ["KUAVLK4B"]),
              ("CAJA MORELIA VALLADOLID", "2025-06-17","2026-06-12", ["KUAU4XSM"]),
              ("CRYOHOLD FASE III",       "2026-01-08","2026-07-14", ["KUAVLK42"]),
              ("SHAREWOODS",              "2025-12-12","2026-07-06", ["KUAVKGOD"]),
              ("PROMINOX",                "2025-06-10","2026-07-22", ["KUAUN2EM"]),
              ("COLEGIO",                 "2026-01-05","2026-07-17", ["KUAUN2EM"]),
              ("CONTINENTAL MOTORES",     "2025-12-29","2026-07-03", ["KUAVLSHS"]),
              ("TRACTIAN",                "2026-02-06","2026-07-01", ["KUAPWMR5"]),
              ("GIANNI'S GROUP",          "2026-01-26","2026-08-24", ["KUAVLK4B"]),
              ("CHENSON",                 "2026-01-14","2027-01-05", ["KUAU4XSD"]),
              ("EDGEUNO F1",              "2026-04-17","2026-08-11", ["KUAU4XSM"]),
              ("VRM MAQUINARIA",          "2026-01-09","2026-10-02", ["KUAPWMR5"]),
              ("NUMARIS",                 "2026-05-14","2026-09-04", []),
              ("OUTLET",                  "2024-05-20","2026-08-06", ["KUAVF4AX"]),
              ("GRUPO PRIMAVERA",         "2024-05-14","2026-07-21", ["KUAVF4AX"]),
              ("COLIMAN BANANA'S",        "2025-06-12","2026-05-20", ["KUAU4XSM"]),
              ("GALDISA",                 "2024-03-19","2026-06-30", ["KUAVKGOD"]),
              ("PANGEA",                  "2024-10-01","2026-07-07", ["KUAPWMR5"]),
              ("IAS",                     "2025-11-03","2027-08-25", ["KUAVLK4B"]),
          ]

          COLORS = ['#1d4ed8','#0e7490','#0f766e','#1e6b55','#4338ca','#6d28d9','#7c3aed',
                    '#2563eb','#0284c7','#0369a1','#1a6b8a','#164e63','#065f46','#0d5c6e',
                    '#1e40af','#3b5998','#5a2d82','#6b21a8','#374151']

          resource_ids = set()
          for _, _, _, owners in PROJECTS:
              for oid in owners:
                  resource_ids.add(oid)

          def is_mexico(c):
              tz = c.get("timezone","")
              return "Mexico" in tz or "America/Mexico" in tz

          netsoft = [cid_to_contact[rid] for rid in resource_ids if rid in cid_to_contact]
          mx = [c for c in netsoft if is_mexico(c)]
          final_resource_list = mx if len(mx) >= 5 else netsoft

          final_contacts = []
          seen_ids = set()
          for c in final_resource_list:
              if c["id"] in seen_ids:
                  continue
              seen_ids.add(c["id"])
              name = (c.get("firstName","") + " " + c.get("lastName","")).upper().strip()
              if name:
                  final_contacts.append({"id": c["id"], "name": name, "role": "GERENTE"})
          final_contacts.sort(key=lambda x: x["name"])
          print("Recursos:", len(final_contacts))
          print("Proyectos:", len(PROJECTS))

          cid_to_idx = {c["id"]: i for i, c in enumerate(final_contacts)}

          res_lines = []
          for c in final_contacts:
              name = c["name"].replace("'","\\'")
              res_lines.append("    ['" + name + "','GERENTE','#1a3354']")

          proj_lines = []
          for i, (name, start, end, _) in enumerate(PROJECTS):
              pname = name.replace("'","\\'")
              proj_lines.append("    ['" + pname + "','" + start + "','" + end + "','" + COLORS[i % len(COLORS)] + "']")

          assign_lines = []
          for pi, (_, start, end, owners) in enumerate(PROJECTS):
              added = set()
              for oid in owners:
                  if oid in cid_to_idx and oid not in added:
                      assign_lines.append("    [" + str(cid_to_idx[oid]) + "," + str(pi) + ",'" + start + "','" + end + "',50]")
                      added.add(oid)

          today = datetime.now().strftime("%B %Y")

          new_init  = "// GANTT_DATA_START\n"
          new_init += "function init(){\n"
          new_init += "  const RES=[\n" + ",\n".join(res_lines) + "\n  ];\n"
          new_init += "  RES.forEach(([n,role,color])=>addRes(n,role,color));\n"
          new_init += "  const PC=PROJ_COLORS;\n"
          new_init += "  const PROJ=[\n" + ",\n".join(proj_lines) + "\n  ];\n"
          new_init += "  PROJ.forEach(([n,s,e,color])=>addProj(n,s,e,color));\n"
          new_init += "  const A=[\n" + ",\n".join(assign_lines) + "\n  ];\n"
          new_init += "  A.forEach(([ri,pi,s,e,pct])=>addAssign(resources[ri].id,projects[pi].id,s,e,pct));\n"
          new_init += "  render();\n}\n"
          new_init += "init();\n// GANTT_DATA_END"

          with open("index.html","r",encoding="utf-8") as f:
              html = f.read()

          s = html.find("// GANTT_DATA_START")
          e = html.find("// GANTT_DATA_END")
          if s == -1 or e == -1:
              print("ERROR: marcadores no encontrados")
              exit(1)

          new_html = html[:s] + new_init + html[e + len("// GANTT_DATA_END"):]
          new_html = re.sub(r'Datos Wrike · [^<"]+', 'Datos Wrike · ' + today, new_html)

          with open("index.html","w",encoding="utf-8") as f:
              f.write(new_html)

          print("OK: index.html actualizado")
          PYEOF

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Gantt actualizado $(date '+%Y-%m-%d')"
          git push
