name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, re, json
          from datetime import datetime

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          FOLDER_ID = "IEAEDUQVIS53CPQR"

          # Ver qué tiene esta carpeta directamente
          r = requests.get(
              "https://www.wrike.com/api/v4/folders/" + FOLDER_ID,
              headers=headers
          )
          print("HTTP folder directo:", r.status_code)
          data = r.json().get("data", [])
          if data:
              f = data[0]
              print("Title:", f.get("title"))
              print("childIds count:", len(f.get("childIds",[])))
              print("childIds:", f.get("childIds",[])[:5])
              print("Todas las keys:", list(f.keys()))
          else:
              print("Respuesta:", str(r.json())[:300])

          PYEOF

      - name: Publicar cambios
        run: |
          echo "Solo debug"
