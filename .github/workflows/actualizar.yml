name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 10 * * 0'  # Domingos a las 10am hora México
  workflow_dispatch:        # También permite correrlo manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar HTML actualizado
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          pip install anthropic requests
          python update.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Gantt actualizado $(date '+%Y-%m-%d')"
          git push
