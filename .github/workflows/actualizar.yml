name: Actualizar Gantt cada domingo

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos desde Wrike
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, re, json
          from datetime import datetime

          WRIKE_TOKEN = os.environ["WRIKE_TOKEN"]
          headers = {"Authorization": "Bearer " + WRIKE_TOKEN}

          print("Consultando Wrike...")

          # PASO 1 — Buscar la carpeta "PROYECTOS ACTIVOS"
          r_spaces = requests.get("https://www.wrike.com/api/v4/folders", headers=headers)
          all_folders = r_spaces.json().get("data", [])
          print("Total folders:", len(all_folders))

          target_folder = None
          for f in all_folders:
              if "PROYECTOS ACTIVOS" in f.get("title","").upper():
                  target_folder = f
                  print("Carpeta encontrada:", f["title"], "| ID:", f["id"])
                  break

          if not target_folder:
              print("ERROR: No se encontro la carpeta PROYECTOS ACTIVOS")
              print("Folders disponibles:", [f["title"] for f in all_folders[:20]])
              exit(1)

          folder_id = target_folder["id"]

          # PASO 2 — Traer subproyectos de esa carpeta
          r2 = requests.get(
              "https://www.wrike.com/api/v4/folders/" + folder_id + "/folders",
              headers=headers,
              params={"project": "true", "fields": '["project","members","customFields"]'}
          )
          print("HTTP subproyectos:", r2.status_code)
          raw2 = r2.json()
          if r2.status_code != 200:
              print("Error response:", str(raw2)[:300])
              exit(1)

          all_projects = raw2.get("data", [])
          print("Total subproyectos:", len(all_projects))

          # Mostrar un ejemplo para entender la estructura
          if all_projects:
              p0 = all_projects[0]
              print("Ejemplo proyecto:", p0.get("title"))
              print("  project keys:", list(p0.get("project",{}).keys()))
              print("  customFields:", json.dumps(p0.get("customFields",[]))[:300])

          PYEOF

      - name: Publicar cambios
        run: |
          echo "Solo debug, no se publica nada aun"
