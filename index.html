<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Allocation — Gantt · Netsoft México</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app-header{background:linear-gradient(135deg,#1a3354,#1e4d8c);color:#fff;padding:0 12px;height:54px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden}
.app-header h1{font-size:.95rem;font-weight:700;letter-spacing:.4px;white-space:nowrap;flex-shrink:0}
.hdr-nav{display:flex;align-items:center;margin-left:auto;flex-shrink:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.hdr-nav::-webkit-scrollbar{display:none}
.hdr-nav button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 9px;font-size:.74rem;cursor:pointer;transition:background .15s;white-space:nowrap;flex-shrink:0;margin-left:4px}
.hdr-nav button:hover{background:rgba(255,255,255,.28)}
.hdr-nav button.active{background:#2563eb;border-color:#2563eb}
.hdr-nav .sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 4px;flex-shrink:0}
#lblRange{font-size:.76rem;opacity:.85;min-width:140px;text-align:center;white-space:nowrap;margin-left:4px}
#syncInfo{font-size:.68rem;opacity:.65;white-space:nowrap;flex-shrink:0;margin-left:6px}
#btnToggleSB{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;width:30px;height:30px;padding:0;font-size:1rem;cursor:pointer;flex-shrink:0;line-height:30px;text-align:center}
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid #d1dae8;display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease}
.sidebar.collapsed{width:0;border-right:none}
.sb-inner{width:220px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:220px}
.sb-tabs{display:flex;border-bottom:2px solid #e2e8f0;flex-shrink:0}
.sb-tab{flex:1;padding:8px 4px;font-size:.72rem;font-weight:600;color:#64748b;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.sb-tab:hover{color:#2563eb}
.sb-tab.active{color:#2563eb;border-bottom-color:#2563eb}
.sb-head{padding:10px 12px 8px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.sb-head h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:6px}
.sb-search{width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:.8rem;outline:none;margin-bottom:6px}
.sb-search:focus{border-color:#2563eb}
.sb-filter{width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:.78rem;outline:none;background:#fff;cursor:pointer}
.sb-filter:focus{border-color:#2563eb}
.sb-letter{padding:3px 12px;font-size:.65rem;font-weight:700;letter-spacing:.8px;color:#94a3b8;background:#f8fafc;border-bottom:1px solid #e2e8f0;text-transform:uppercase;user-select:none}
.sb-count{font-size:.65rem;color:#94a3b8;text-align:center;padding:8px 0}
.sb-list{flex:1;overflow-y:auto;padding:4px 0}
.sb-item{display:flex;align-items:center;padding:6px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .1s}
.sb-item:hover{background:#eff6ff}
.sb-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;flex-shrink:0;margin-right:8px}
.sb-info{flex:1;min-width:0}
.sb-name{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1e293b}
.sb-role{font-size:.67rem;color:#64748b}
.sb-badge{font-size:.65rem;background:#dbeafe;color:#1d4ed8;border-radius:10px;padding:1px 6px;flex-shrink:0;margin-left:4px}
.sb-foot{padding:8px 12px;border-top:1px solid #e2e8f0;background:#f8fafc}
.btn-add{width:100%;padding:7px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:.78rem;cursor:pointer;font-weight:600}
.btn-add:hover{background:#1d4ed8}
.sp-stats{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.gantt-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.gantt-wrap{flex:1;overflow:auto;position:relative}
.gantt-inner{position:relative;display:inline-block;min-width:100%}
.tl-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #cbd5e1;display:flex}
.tl-corner{position:sticky;left:0;z-index:30;background:#f8fafc;border-right:1px solid #d1dae8;border-bottom:2px solid #cbd5e1;display:flex;align-items:center;padding:0 10px;font-size:.7rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.tl-col-wrap{flex:1;overflow:hidden}
.tl-months{display:flex;border-bottom:1px solid #e2e8f0;overflow:hidden}
.tl-mon-cell{border-right:1px solid #e2e8f0;font-size:.72rem;font-weight:700;color:#1e4d8c;padding:4px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#f8fafc;flex-shrink:0}
.tl-weeks{display:flex;overflow:hidden}
.tl-wk-cell{border-right:1px solid #e2e8f0;font-size:.67rem;color:#64748b;padding:3px 2px;text-align:center;overflow:hidden;white-space:nowrap;background:#fff;flex-shrink:0}
.tl-wk-cell.today-wk{background:#fef9c3;color:#92400e;font-weight:700}
.g-row{display:flex;position:relative;border-bottom:1px solid #e2e8f0;min-height:52px}
.g-row:hover .g-label{background:#eff6ff}
.g-row.over .g-label{background:#fef2f2}
.g-label{position:sticky;left:0;z-index:10;width:220px;min-width:220px;flex-shrink:0;background:#fff;border-right:1px solid #d1dae8;display:flex;align-items:center;padding:0 8px;transition:background .1s;overflow:hidden}
.g-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:#fff;flex-shrink:0;margin-right:6px}
.g-linfo{min-width:0;flex:1;overflow:hidden}
.g-lname{font-size:.7rem;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.g-lrole{font-size:.6rem;color:#64748b;white-space:nowrap}
.g-canvas{flex:1;position:relative;overflow:hidden}
.bar{position:absolute;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:.62rem;font-weight:600;color:#fff;overflow:hidden;cursor:grab;transition:filter .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);user-select:none}
.bar:hover{filter:brightness(1.1)}
.bar.is-dragging{opacity:.82;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:50;filter:brightness(1.08)}
.bar-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;flex:1;min-width:0}
.bar-handle{position:absolute;top:1px;bottom:1px;width:7px;cursor:ew-resize;border-radius:3px;background:rgba(255,255,255,.35);opacity:0;transition:opacity .15s;z-index:2}
.bar:hover .bar-handle{opacity:1}
.bar-handle-l{left:2px}
.bar-handle-r{right:2px}
body.bar-dragging *{cursor:grabbing!important;user-select:none!important}
body.bar-resizing *{cursor:ew-resize!important;user-select:none!important}
#dragHint{position:fixed;background:#1e293b;color:#fff;padding:5px 10px;border-radius:7px;font-size:.72rem;z-index:400;pointer-events:none;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3);display:none}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;opacity:.7;z-index:15;pointer-events:none}
.g-proj-label{position:sticky;left:0;z-index:10;width:220px;min-width:220px;flex-shrink:0;background:#fff;border-right:1px solid #d1dae8;display:flex;flex-direction:column;justify-content:center;padding:0 10px;overflow:hidden;transition:background .1s}
.g-proj-name{font-size:.72rem;font-weight:700;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-proj-dates{font-size:.6rem;color:#94a3b8;white-space:nowrap}
.portlet{padding:14px 14px 10px;border-bottom:1px solid #e2e8f0}
.portlet h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:10px;font-weight:700}
.kpi-row{display:flex;margin-bottom:10px}
.kpi-card{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;text-align:center;margin-right:8px}
.kpi-card:last-child{margin-right:0}
.kpi-val{font-size:1.35rem;font-weight:800;color:#1e4d8c}
.kpi-lbl{font-size:.64rem;color:#64748b;margin-top:2px}
.role-bar-wrap{margin-bottom:8px}
.role-bar-lbl{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:3px}
.role-bar-lbl span:first-child{font-weight:600;color:#1e293b}
.role-bar-lbl span:last-child{color:#64748b}
.role-bar-bg{background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden}
.role-bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,#2563eb,#3b82f6);transition:width .4s}
.role-bar-fill.mgr{background:linear-gradient(90deg,#1a3354,#1e4d8c)}
.over-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;margin-top:6px}
.over-box h5{font-size:.7rem;color:#b91c1c;font-weight:700;margin-bottom:4px}
.over-item{font-size:.68rem;color:#7f1d1d;padding:1px 0}
.avail-item{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9}
.avail-item:last-child{border:none}
.avail-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0;margin-right:8px}
.avail-name{flex:1;font-size:.72rem;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-badge{font-size:.65rem;border-radius:10px;padding:2px 7px;font-weight:700;white-space:nowrap}
.slot-2{background:#dcfce7;color:#15803d}
.slot-1{background:#dbeafe;color:#1d4ed8}
.assign-info-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center}
.assign-info-color{width:12px;height:12px;border-radius:50%;margin-right:10px;flex-shrink:0}
.assign-info-proj{font-size:.82rem;font-weight:700;color:#1e293b}
.assign-info-res{font-size:.72rem;color:#64748b;margin-top:2px}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;min-width:360px;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{font-size:1rem;font-weight:700;color:#1e293b;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:.75rem;font-weight:600;color:#64748b;margin-bottom:4px}
.form-row input,.form-row select{width:100%;padding:7px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:.82rem;outline:none}
.form-row input:focus,.form-row select:focus{border-color:#2563eb}
.form-actions{display:flex;margin-top:16px;justify-content:flex-end}
.form-actions button{margin-left:8px}
.btn-save{padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:7px;font-size:.82rem;cursor:pointer;font-weight:600}
.btn-save:hover{background:#1d4ed8}
.btn-cancel{padding:8px 16px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:7px;font-size:.82rem;cursor:pointer}
.btn-cancel:hover{background:#e2e8f0}
.del-list{max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
.del-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:.78rem}
.del-row:last-child{border:none}
.btn-del{background:#fee2e2;color:#b91c1c;border:none;border-radius:5px;padding:3px 8px;font-size:.72rem;cursor:pointer;font-weight:600}
.btn-del:hover{background:#fecaca}
.tooltip{position:fixed;background:#1e293b;color:#fff;padding:8px 12px;border-radius:8px;font-size:.75rem;z-index:200;pointer-events:none;max-width:220px;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>

<div class="app-header">
  <button id="btnToggleSB" onclick="toggleSidebar()" title="Mostrar/Ocultar recursos">&#9776;</button>
  <h1>&#128202; Resource Allocation — Netsoft México</h1>
  <div class="hdr-nav">
    <button id="btnMonth" class="active" onclick="setView('month')">Mes</button>
    <button id="btnWeek" onclick="setView('week')">Semana</button>
    <div class="sep"></div>
    <button onclick="navigate(-1)">&#8249;</button>
    <span id="lblRange"></span>
    <button onclick="navigate(1)">&#8250;</button>
    <button onclick="navigate(0)">Hoy</button>
    <div class="sep"></div>
    <button id="btnByRes" class="active" onclick="setGanttView('resource')">Por Recurso</button>
    <button id="btnByProj" onclick="setGanttView('project')">Por Proyecto</button>
    <div class="sep"></div>
    <button onclick="showModal('addRes')">+ Recurso</button>
    <button onclick="showModal('addProj')">+ Proyecto</button>
    <button onclick="showModal('addAssign')">+ Asignación</button>
    <div class="sep"></div>
    <button onclick="showModal('delRes')">&#8722; Recurso</button>
    <button onclick="showModal('delProj')">&#8722; Proyecto</button>
    <button onclick="showModal('delAssign')">&#8722; Asignación</button>
    <div class="sep"></div>
    <span id="syncInfo">🔄 Datos Wrike · May 2026</span>
  </div>
</div>

<div class="app-body">
  <div class="sidebar" id="sidebar">
    <div class="sb-inner">
      <div class="sb-tabs">
        <button class="sb-tab active" id="tabList" onclick="setSPTab('list')">&#9776; Lista</button>
        <button class="sb-tab" id="tabStats" onclick="setSPTab('stats')">&#9685; Stats</button>
      </div>
      <div id="spList" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
        <div class="sb-head">
          <h3 id="sbListTitle">Recursos</h3>
          <input class="sb-search" id="sbSearch" placeholder="Buscar…" oninput="renderSidebar();renderGantt()">
          <select class="sb-filter" id="sbProject" onchange="renderSidebar();renderGantt()">
            <option value="">Todos los proyectos</option>
          </select>
        </div>
        <div class="sb-list" id="sbList"></div>
        <div class="sb-foot"><button class="btn-add" onclick="showModal('addAssign')">+ Asignar</button></div>
      </div>
      <div id="spStats" class="sp-stats" style="display:none"></div>
    </div>
  </div>
  <div class="gantt-area">
    <div class="gantt-wrap" id="ganttWrap">
      <div class="gantt-inner" id="ganttInner"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" style="display:none"></div>
<div id="dragHint"></div>
<div class="modal-bg" id="modalBg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
let resources=[],projects=[],assignments=[];
let rId=0,pId=0,aId=0;
let view='month',offset=0,ganttView='resource',spTab='list';

const PROJ_COLORS=['#1d4ed8','#0e7490','#0f766e','#1e6b55','#4338ca','#6d28d9','#7c3aed','#2563eb','#0284c7','#0369a1','#1a6b8a','#164e63','#065f46','#0d5c6e','#1e40af','#3b5998','#5a2d82','#6b21a8','#374151'];

function addRes(n,role,color){rId++;resources.push({id:rId,name:n,role,color,active:true});return rId;}
function delRes(id){resources=resources.filter(r=>r.id!==id);assignments=assignments.filter(a=>a.rid!==id);}
function addProj(n,s,e,color){pId++;projects.push({id:pId,name:n,start:s,end:e,color:color||PROJ_COLORS[pId%PROJ_COLORS.length]});return pId;}
function delProj(id){projects=projects.filter(p=>p.id!==id);assignments=assignments.filter(a=>a.pid!==id);}
function addAssign(rid,pid,s,e,pct){aId++;assignments.push({id:aId,rid,pid,start:s,end:e,pct:pct||50});}
function delAssign(id){assignments=assignments.filter(a=>a.id!==id);}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
const pd=s=>new Date(s+'T00:00:00');
const fd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addD(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffD(a,b){return Math.round((b-a)/86400000)}
function wkStart(d){let x=new Date(d);x.setDate(x.getDate()-x.getDay()+1);return x}
function isoWeek(d){let t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));let day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);let y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const MFULL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function getVP(){
  if(view==='month'){
    let m0=new Date(TODAY.getFullYear(),TODAY.getMonth()+offset,1);
    let days=[],cur=new Date(m0),endM=new Date(m0.getFullYear(),m0.getMonth()+6,0);
    while(cur<=endM){days.push(new Date(cur));cur=addD(cur,1);}
    return{px:9,days,start:days[0],end:days[days.length-1]};
  } else {
    let w0=wkStart(addD(TODAY,offset*7));
    let days=[],cur=new Date(w0);
    for(let i=0;i<56;i++){days.push(new Date(cur));cur=addD(cur,1);}
    return{px:28,days,start:days[0],end:days[days.length-1]};
  }
}

function lanes(bars){
  let laneEnds=[];
  return bars.map(b=>{
    let s=pd(b.start),e=pd(b.end);
    let lane=laneEnds.findIndex(le=>le<s);
    if(lane===-1){lane=laneEnds.length;laneEnds.push(e);}
    else laneEnds[lane]=e;
    return{...b,lane};
  });
}

function updateLabel(){
  let vp=getVP();
  if(view==='month'){let s=vp.start,e=vp.end;document.getElementById('lblRange').textContent=`${MFULL[s.getMonth()]} ${s.getFullYear()} – ${MFULL[e.getMonth()]} ${e.getFullYear()}`;}
  else{let s=vp.start,e=vp.end;document.getElementById('lblRange').textContent=`Sem ${isoWeek(s)} – Sem ${isoWeek(e)} (${s.getFullYear()})`;}
}

function shortResName(name){
  var p=name.split(' ');
  if(p.length<=2)return name;
  if(p.length===3)return p[0]+' '+p[1];
  return p[0]+' '+p[2];
}

function render(){updateLabel();renderSidebar();renderGantt();if(spTab==='stats')renderPortlets();}

function getFilteredResources(){
  var q=(document.getElementById('sbSearch').value||'').toLowerCase();
  var pid=document.getElementById('sbProject').value;
  var list=resources.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(q)list=list.filter(r=>r.name.toLowerCase().includes(q));
  if(pid){var pidN=parseInt(pid);list=list.filter(r=>assignments.some(a=>a.rid===r.id&&a.pid===pidN));}
  return list;
}

function getFilteredProjects(){
  var q=(document.getElementById('sbSearch').value||'').toLowerCase();
  return projects.slice().filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,b)=>a.start.localeCompare(b.start));
}

function renderSidebar(){
  if(ganttView==='project'){renderSidebarProjects();return;}
  var sel=document.getElementById('sbProject'),curVal=sel.value;
  sel.innerHTML='<option value="">Todos los proyectos</option>';
  projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    var opt=document.createElement('option');opt.value=p.id;opt.textContent=p.name;
    if(String(p.id)===curVal)opt.selected=true;
    sel.appendChild(opt);
  });
  var filtered=getFilteredResources(),list=document.getElementById('sbList');
  list.innerHTML='';
  var lastLetter='';
  filtered.forEach(r=>{
    var letter=r.name.charAt(0).toUpperCase();
    if(letter!==lastLetter){lastLetter=letter;var sep=document.createElement('div');sep.className='sb-letter';sep.textContent=letter;list.appendChild(sep);}
    var cnt=assignments.filter(a=>a.rid===r.id).length;
    var initials=r.name.split(' ').slice(0,2).map(w=>w[0]).join('');
    var div=document.createElement('div');div.className='sb-item';div.title=r.name;

function renderGantt(){
  const vp=getVP(),inner=document.getElementById('ganttInner');
  inner.innerHTML='';
  const RH=52,LW=220,totalW=vp.days.length*vp.px;
  let hdr=document.createElement('div');hdr.className='tl-header';
  let corner=document.createElement('div');corner.className='tl-corner';corner.style.width=corner.style.minWidth=LW+'px';hdr.appendChild(corner);
  let colsDiv=document.createElement('div');colsDiv.className='tl-col-wrap';colsDiv.style.width=colsDiv.style.minWidth=totalW+'px';
  let monRow=document.createElement('div');monRow.className='tl-months';monRow.style.width=totalW+'px';
  let wkRow=document.createElement('div');wkRow.className='tl-weeks';wkRow.style.width=totalW+'px';
  if(view==='month'){
    let mGroups={};
    vp.days.forEach(d=>{let k=d.getFullYear()*100+d.getMonth();if(!mGroups[k])mGroups[k]={y:d.getFullYear(),m:d.getMonth(),count:0};mGroups[k].count++;});
    Object.values(mGroups).forEach(g=>{let cell=document.createElement('div');cell.className='tl-mon-cell';cell.style.width=cell.style.minWidth=(g.count*vp.px)+'px';cell.textContent=MFULL[g.m]+' '+g.y;monRow.appendChild(cell);});
    let wGroups=[],cur=null;
    vp.days.forEach(d=>{let wk=isoWeek(d);if(!cur||cur.wk!==wk){cur={wk,count:0};wGroups.push(cur);}cur.count++;});
    wGroups.forEach(g=>{let cell=document.createElement('div');cell.className='tl-wk-cell';if(isoWeek(TODAY)===g.wk&&TODAY>=vp.start&&TODAY<=vp.end)cell.classList.add('today-wk');cell.style.width=cell.style.minWidth=(g.count*vp.px)+'px';cell.textContent='S'+g.wk;wkRow.appendChild(cell);});
  } else {
    let mGroups={};
    vp.days.forEach(d=>{let k=d.getFullYear()*100+d.getMonth();if(!mGroups[k])mGroups[k]={y:d.getFullYear(),m:d.getMonth(),count:0};mGroups[k].count++;});
    Object.values(mGroups).forEach(g=>{let cell=document.createElement('div');cell.className='tl-mon-cell';cell.style.width=cell.style.minWidth=(g.count*vp.px)+'px';cell.textContent=MFULL[g.m]+' '+g.y;monRow.appendChild(cell);});
    vp.days.forEach(d=>{let cell=document.createElement('div');cell.className='tl-wk-cell';if(d.getTime()===TODAY.getTime())cell.classList.add('today-wk');cell.style.width=cell.style.minWidth=vp.px+'px';cell.textContent=d.getDate();wkRow.appendChild(cell);});
  }
  colsDiv.appendChild(monRow);colsDiv.appendChild(wkRow);hdr.appendChild(colsDiv);inner.appendChild(hdr);
  const todayX=diffD(vp.start,TODAY);
  const todayPx=todayX>=0&&todayX<vp.days.length?todayX*vp.px+vp.px/2:null;

  if(ganttView==='project'){
    getFilteredProjects().forEach(proj=>{
      var myA=assignments.filter(a=>a.pid===proj.id);
      var wL=lanes(myA.slice().sort((a,b)=>a.start.localeCompare(b.start)));
      var lC=Math.max(1,wL.reduce((m,b)=>Math.max(m,b.lane+1),1));
      var rowH=Math.max(RH,lC*26+12);
      var row=document.createElement('div');row.className='g-row';row.style.minHeight=rowH+'px';
      var lbl=document.createElement('div');lbl.className='g-proj-label';lbl.style.minHeight=rowH+'px';lbl.style.borderLeft='3px solid '+proj.color;lbl.title=proj.name;
      lbl.innerHTML=`<div class="g-proj-name">${proj.name}</div><div class="g-proj-dates">${proj.start.slice(0,7)} → ${proj.end.slice(0,7)}</div>`;
      row.appendChild(lbl);
      var canvas=document.createElement('div');canvas.className='g-canvas';canvas.style.cssText=`width:${totalW}px;position:relative;min-height:${rowH}px`;
      if(todayPx!==null){var tl=document.createElement('div');tl.className='today-line';tl.style.left=todayPx+'px';canvas.appendChild(tl);}
      wL.forEach(a=>{
        var res=resources.find(r=>r.id===a.rid);if(!res)return;
        var s=pd(a.start),e=pd(a.end);
        var x0=Math.max(0,diffD(vp.start,s))*vp.px,x1=Math.min(vp.days.length,diffD(vp.start,e)+1)*vp.px,w=x1-x0;if(w<=0)return;
        var bar=document.createElement('div');bar.className='bar';bar.setAttribute('data-aid',a.id);
        bar.style.cssText=`left:${x0}px;width:${w}px;top:${6+a.lane*26}px;height:22px;background:${res.color}`;
        var hL=document.createElement('div');hL.className='bar-handle bar-handle-l';(aid=>{hL.addEventListener('mousedown',ev=>barDragStart(ev,aid,'resize-left'));})(a.id);bar.appendChild(hL);
        var txt=document.createElement('span');txt.className='bar-txt';txt.textContent=w>=80?shortResName(res.name):w>=40?res.name.split(' ')[0]:'';bar.appendChild(txt);
        var hR=document.createElement('div');hR.className='bar-handle bar-handle-r';(aid=>{hR.addEventListener('mousedown',ev=>barDragStart(ev,aid,'resize-right'));})(a.id);bar.appendChild(hR);
        ((aid,pn,rn,pct)=>{bar.addEventListener('mousedown',ev=>{if(ev.target===hL||ev.target===hR)return;barDragStart(ev,aid,'move');});bar.addEventListener('mouseenter',ev=>{if(!dragState)showTT(ev,`<b>${rn}</b><br>${pn}<br>${a.start} → ${a.end}<br>${pct}%`);});bar.addEventListener('mouseleave',hideTT);})(a.id,proj.name,res.name,a.pct);
        canvas.appendChild(bar);
      });
      row.appendChild(canvas);inner.appendChild(row);
    });
    return;
  }

  getFilteredResources().forEach(r=>{
    var myA=assignments.filter(a=>a.rid===r.id);
    var wL=lanes(myA.slice().sort((a,b)=>a.start.localeCompare(b.start)));
    var lC=Math.max(1,...(wL.length?wL.map(b=>b.lane+1):[1]));
    var rowH=Math.max(RH,lC*26+12);
    var active=myA.filter(a=>pd(a.start)<=TODAY&&pd(a.end)>=TODAY);
    var over=active.length>2;
    var row=document.createElement('div');row.className='g-row'+(over?' over':'');row.style.minHeight=rowH+'px';
    var initials=r.name.split(' ').slice(0,2).map(w=>w[0]).join('');
    var lbl=document.createElement('div');lbl.className='g-label';lbl.style.minHeight=rowH+'px';lbl.title=r.name;
    lbl.innerHTML=`<div class="g-avatar" style="background:${r.color}">${initials}</div><div class="g-linfo"><div class="g-lname">${shortResName(r.name)}</div><div class="g-lrole">${r.role}</div></div>`;
    row.appendChild(lbl);
    var canvas=document.createElement('div');canvas.className='g-canvas';canvas.style.cssText=`width:${totalW}px;position:relative;min-height:${rowH}px`;
    if(todayPx!==null){var tl=document.createElement('div');tl.className='today-line';tl.style.left=todayPx+'px';canvas.appendChild(tl);}
    wL.forEach(a=>{
      var proj=projects.find(p=>p.id===a.pid);if(!proj)return;
      var s=pd(a.start),e=pd(a.end);
      var x0=Math.max(0,diffD(vp.start,s))*vp.px,x1=Math.min(vp.days.length,diffD(vp.start,e)+1)*vp.px,w=x1-x0;if(w<=0)return;
      var words=proj.name.split(' ');
      var bar=document.createElement('div');bar.className='bar';bar.setAttribute('data-aid',a.id);
      bar.style.cssText=`left:${x0}px;width:${w}px;top:${6+a.lane*26}px;height:22px;background:${proj.color}`;
      var hL=document.createElement('div');hL.className='bar-handle bar-handle-l';(aid=>{hL.addEventListener('mousedown',ev=>barDragStart(ev,aid,'resize-left'));})(a.id);bar.appendChild(hL);
      var txt=document.createElement('span');txt.className='bar-txt';txt.textContent=w>=90?proj.name:w>=40?words[0]:'';bar.appendChild(txt);
      var hR=document.createElement('div');hR.className='bar-handle bar-handle-r';(aid=>{hR.addEventListener('mousedown',ev=>barDragStart(ev,aid,'resize-right'));})(a.id);bar.appendChild(hR);
      ((aid,pn,rn,pct)=>{bar.addEventListener('mousedown',ev=>{if(ev.target===hL||ev.target===hR)return;barDragStart(ev,aid,'move');});bar.addEventListener('mouseenter',ev=>{if(!dragState)showTT(ev,`<b>${pn}</b><br>${rn}<br>${a.start} → ${a.end}<br>${pct}%`);});bar.addEventListener('mouseleave',hideTT);})(a.id,proj.name,r.name,a.pct);
      canvas.appendChild(bar);
    });
    row.appendChild(canvas);inner.appendChild(row);
  });
}

// ── DRAG ──────────────────────────────────────────────────────────────────────
var dragState=null;
function barDragStart(ev,aId,mode){
  ev.preventDefault();ev.stopPropagation();hideTT();
  var bar=ev.currentTarget;if(mode!=='move')bar=ev.currentTarget.parentNode;
  var vp=getVP();
  dragState={aId,mode,startX:ev.clientX,startY:ev.clientY,startLeft:parseFloat(bar.style.left)||0,startWidth:parseFloat(bar.style.width)||0,bar,vp,moved:false};
  document.body.className=mode==='move'?'bar-dragging':'bar-resizing';
}
function barDragMove(ev){
  if(!dragState)return;
  var ds=dragState,dx=ev.clientX-ds.startX,dy=ev.clientY-ds.startY;
  if(!ds.moved){if(Math.sqrt(dx*dx+dy*dy)<4)return;ds.moved=true;ds.bar.classList.add('is-dragging');}
  var px=ds.vp.px,totalW=ds.vp.days.length*px,b=ds.bar;
  var newLeft=ds.startLeft,newWidth=ds.startWidth;
  if(ds.mode==='move'){newLeft=Math.max(0,Math.min(totalW-ds.startWidth,ds.startLeft+dx));b.style.left=newLeft+'px';}
  else if(ds.mode==='resize-right'){newWidth=Math.max(px,Math.min(totalW-ds.startLeft,ds.startWidth+dx));b.style.width=newWidth+'px';newLeft=ds.startLeft;}
  else if(ds.mode==='resize-left'){var clamp=Math.min(ds.startWidth-px,dx);newLeft=Math.max(0,ds.startLeft+clamp);newWidth=Math.max(px,ds.startWidth-(newLeft-ds.startLeft));b.style.left=newLeft+'px';b.style.width=newWidth+'px';}
  var txt=b.querySelector('.bar-txt');
  if(txt){var a=assignments.find(x=>x.id===ds.aId);if(a){var proj=projects.find(p=>p.id===a.pid);if(proj){var w2=parseFloat(b.style.width)||0;txt.textContent=w2>=90?proj.name:w2>=40?proj.name.split(' ')[0]:'';}}}
  var hint=document.getElementById('dragHint');
  var sd=Math.max(0,Math.min(ds.vp.days.length-1,Math.round(newLeft/px)));
  var ed=Math.max(sd,Math.min(ds.vp.days.length-1,Math.round((newLeft+newWidth)/px)-1));
  hint.textContent=fd(ds.vp.days[sd])+' → '+fd(ds.vp.days[ed]);
  hint.style.display='block';hint.style.left=(ev.clientX+14)+'px';hint.style.top=(ev.clientY-36)+'px';
}
function barDragEnd(ev){
  if(!dragState)return;
  var ds=dragState,b=ds.bar;
  document.body.className='';document.getElementById('dragHint').style.display='none';b.classList.remove('is-dragging');
  if(!ds.moved){dragState=null;showEditAssign(ds.aId);return;}
  var px=ds.vp.px,newLeft=parseFloat(b.style.left)||0,newWidth=parseFloat(b.style.width)||0;
  var sd=Math.max(0,Math.min(ds.vp.days.length-1,Math.round(newLeft/px)));
  var ed=Math.max(sd,Math.min(ds.vp.days.length-1,Math.round((newLeft+newWidth)/px)-1));
  var a=assignments.find(x=>x.id===ds.aId);
  if(a){a.start=fd(ds.vp.days[sd]);a.end=fd(ds.vp.days[ed]);}
  dragState=null;render();
}
document.addEventListener('mousemove',barDragMove);
document.addEventListener('mouseup',barDragEnd);
